name: Podman E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  podman-rootful:
    name: Podman E2E (rootful, 6.1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quarshell-driver
    env:
      QUARSHELL_TESTCONTAINERS: "1"
      QUARSHELL_TEST_PODMAN_IMAGE: quarshell-podman6-e2e:local
      QUARSHELL_PODMAN_USERNS_E2E: "1"
      QUARSHELL_PODMAN_USERNS_STRICT: "1"
      QUARSHELL_PODMAN_WORKSPACE: ${{ runner.temp }}/podman-workspace
      QUARSHELL_E2E_SANDBOX_IMAGE: registry.fedoraproject.org/fedora:45
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          path: quarshell-driver
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-core
          ref: v0.5.0
          path: quarshell-core
      - name: Checkout quarshell-proto workspace dependency
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.3
          path: quarshell-proto
      - name: Checkout quarshell-proxy workspace dependency
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proxy
          ref: v0.1.2
          path: quarshell-proxy
      - name: Configure Go workspace
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          {
            echo 'go 1.27.0'
            echo 'use ('
            modules=()
            for d in "$workspace"/quarshell-*; do
              [[ -f "$d/go.mod" ]] && modules+=("${d##*/}")
            done
            for d in "${modules[@]}"; do echo "  ./$d"; done
            echo ')'
            echo 'replace ('
            for d in "${modules[@]}"; do
              module="$(sed -n 's/^module[[:space:]][[:space:]]*//p' "$workspace/$d/go.mod" | head -n 1)"
              [[ -n "$module" ]] || continue
              for source in "${modules[@]}"; do
                awk -v module="$module" '$1 == module && $2 ~ /^v[0-9]/ { print $2 }; $1 == "require" && $2 == module && $3 ~ /^v[0-9]/ { print $3 }' "$workspace/$source/go.mod"
              done | sort -u | while IFS= read -r version; do
                printf '  %s %s => ./%s\n' "$module" "$version" "$d"
              done
            done
          } > "$workspace/go.work"
          echo "Wrote go.work:" && cat "$workspace/go.work"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: |
            quarshell-driver/go.sum
            quarshell-core/go.sum
      - name: Build official Podman 6 E2E image
        env:
          QUARSHELL_PODMAN_FIXTURE_DIGEST_FILE: ${{ runner.temp }}/podman6-fixture-image-id.txt
        run: ./scripts/build-podman6-fixture.sh "$QUARSHELL_TEST_PODMAN_IMAGE"
      - name: Prepare Podman workspace
        run: mkdir -p "$QUARSHELL_PODMAN_WORKSPACE"
      - name: Require native Libpod blackhole route create and inspect
        env:
          QUARSHELL_PODMAN_NATIVE_NETWORK_E2E: "1"
        run: go test -v -count=1 -timeout=5m ./internal/podman -run '^TestPodmanNativeBlackholeRouteCreateInspectE2E$'
      - name: Run Podman behavioral E2E suite
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/podman-e2e.log"
          go test -v -count=1 -timeout=20m ./tests/e2e/podman 2>&1 | tee "$log"
          for test_name in \
            TestPodmanUsernsMatrixE2E \
            TestPodmanUsernsMatrixE2E/private \
            TestPodmanUsernsMatrixE2E/auto \
            TestPodmanUsernsMatrixE2E/host \
            TestPodmanUsernsMatrixE2E/keep-id \
            TestPodmanDriverLifecycleAgainstTestcontainersEngine \
            TestPodmanDriverRecoversAfterServiceRestart \
            TestPodmanPullPolicyNeverFailsClosedBeforeNetworkCreate \
            TestPodmanPullPolicySupportsDigestPinnedImage; do
            if ! grep -F -- "--- PASS: $test_name" "$log" >/dev/null; then
              echo "required Podman E2E test did not pass: $test_name" >&2
              exit 1
            fi
          done
          grep -F -- '--- SKIP: TestPodmanUsernsMatrixE2E/no-map' "$log" >/dev/null
          grep -F -- 'expected capability skip: no-map is only supported in rootless mode' "$log" >/dev/null
          {
            echo "### Podman behavioral E2E"
            echo "- Engine: rootful $(docker run --rm "$QUARSHELL_TEST_PODMAN_IMAGE" podman --version) from Fedora 45 in a disposable privileged container"
            echo "- Fixture image ID: $(cat "$RUNNER_TEMP/podman6-fixture-image-id.txt")"
            echo "- Required tests passed: 4 (lifecycle, service recovery, pull policy, digest pinning)"
            echo "- Rootless coverage: not included in this job"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Podman fixture image ID evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podman6-fixture-image-id-rootful-${{ github.run_id }}
          path: ${{ runner.temp }}/podman6-fixture-image-id.txt
          if-no-files-found: ignore
          retention-days: 7

  podman-legacy-negative:
    name: Podman E2E (5.8.7 fail-closed compatibility)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: quarshell-driver
    env:
      QUARSHELL_TESTCONTAINERS: "1"
      QUARSHELL_PODMAN_LEGACY_NEGATIVE: "1"
    steps:
      - name: Checkout driver
        uses: actions/checkout@v4
        with:
          path: quarshell-driver
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-core
          ref: v0.5.0
          path: quarshell-core
      - name: Checkout quarshell-proto workspace dependency
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.3
          path: quarshell-proto
      - name: Checkout quarshell-proxy workspace dependency
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proxy
          ref: v0.1.2
          path: quarshell-proxy
      - name: Configure Go workspace
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          {
            echo 'go 1.27.0'
            echo 'use ('
            modules=()
            for d in "$workspace"/quarshell-*; do
              [[ -f "$d/go.mod" ]] && modules+=("${d##*/}")
            done
            for d in "${modules[@]}"; do echo "  ./$d"; done
            echo ')'
            echo 'replace ('
            for d in "${modules[@]}"; do
              module="$(sed -n 's/^module[[:space:]][[:space:]]*//p' "$workspace/$d/go.mod" | head -n 1)"
              [[ -n "$module" ]] || continue
              for source in "${modules[@]}"; do
                awk -v module="$module" '$1 == module && $2 ~ /^v[0-9]/ { print $2 }; $1 == "require" && $2 == module && $3 ~ /^v[0-9]/ { print $3 }' "$workspace/$source/go.mod"
              done | sort -u | while IFS= read -r version; do
                printf '  %s %s => ./%s\n' "$module" "$version" "$d"
              done
            done
          } > "$workspace/go.work"
          echo "Wrote go.work:" && cat "$workspace/go.work"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: |
            quarshell-driver/go.sum
            quarshell-core/go.sum
      - name: Select digest-pinned Podman 5.8.7 negative fixture
        run: |
          image="$(python3 -c 'import json; print(json.load(open("scripts/vm-engine-fixtures.lock.json"))["podman_legacy_negative"])')"
          prefix='quay.io/podman/stable:v5.8.7@sha256:'
          [[ "$image" == "$prefix"* ]] || { echo "invalid Podman legacy fixture lock: $image" >&2; exit 1; }
          digest="${image#"$prefix"}"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid Podman legacy fixture digest: $digest" >&2; exit 1; }
          echo "QUARSHELL_TEST_PODMAN_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Require legacy Podman to reject unsafe network before workload creation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-required-go-test.py \
            --test TestPodmanLegacyRejectsUnsupportedNetworkBeforeWorkloadStart -- \
            go test -json -count=1 -timeout=10m ./tests/e2e/podman \
              -run '^TestPodmanLegacyRejectsUnsupportedNetworkBeforeWorkloadStart$'
          {
            echo "### Legacy Podman negative compatibility"
            echo "- Engine: $QUARSHELL_TEST_PODMAN_IMAGE, version verified exactly in the test"
            echo "- Required behavior: proxy-backed create rejected before network or workload creation"
          } >> "$GITHUB_STEP_SUMMARY"
